name: Download badges

on:
  schedule:
    - cron: "0 */1 * * *"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sumar descargas por paquete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .github/badges
          sum_for() {
            gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
              --jq ".[].assets[] | select(.name | endswith(\"-$1.zip\")) | .download_count" \
              | awk '{s+=$1} END {print s+0}'
          }
          for pack in ESP ENG; do
            total=$(sum_for "$pack")
            lower=$(echo "$pack" | tr 'A-Z' 'a-z')
            echo "$pack = $total"
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' \
              "$pack" "$total" "$([ "$pack" = ESP ] && echo 07f713 || echo 0794f7)" \
              > ".github/badges/$lower.json"
          done

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git diff --cached --quiet || git commit -m "chore: update download badges [skip ci]"
          git push
